<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Read Me Reddit</title>
  <link rel="icon" href="./icons/icon32.png">
  <link rel="stylesheet" href="./engine/playback-module/highlighting/highlighting.css">
  <link rel="stylesheet" href="./engine/styles/loading-interface-styles.css">
  <link rel="stylesheet" href="./engine/styles/styles-returns-interface-fullchunk.css">
  <link rel="stylesheet" href="./engine/styles/styles-returns-interface-pageview.css">
  <link rel="stylesheet" href="./engine/styles/styles-returns-interface-navigation.css">
  <link rel="stylesheet" href="./engine/overlay/styles-overlay.css">
  <link rel="stylesheet" href="./engine/overlay/styles-overlay-actions.css">
  <style>
    /* Tokens from ArT Reader - Engine (shared)/AGENT_brand-spec-for-build.md */
    :root {
      color-scheme: dark;

      --brand-gold: #FBBF24;
      --brand-gold-deep: #d59a12;
      --brand-gold-soft: #f1c75a;

      --overlay-title-inactive-background: rgba(251, 191, 36, 0.05);
      --overlay-title-shell-base: #1a1a1a;
      --overlay-title-text-color: rgba(251, 191, 36, 0.62);
      --overlay-title-background-color: var(--overlay-title-inactive-background);
      --overlay-title-active-background-color: color-mix(in srgb, var(--brand-gold) 62%, var(--overlay-title-shell-base) 38%);
      --overlay-title-active-text-color: color-mix(in srgb, var(--brand-gold) 5%, var(--overlay-title-shell-base) 95%);
      --overlay-title-active-background: var(--overlay-title-active-background-color);
      --overlay-title-filled-inactive-background: rgba(251, 191, 36, 0.05);

      --reader-selection-background: var(--overlay-title-filled-inactive-background);
      --reader-selection-text-color: var(--brand-gold);
      --reader-selection-border-color: rgba(251, 191, 36, 0.75);

      --overlay-focus-ring-color: rgba(251, 191, 36, 0.9);
      --overlay-focus-ring-width: 2px;
      --overlay-focus-ring-offset: -2px;

      --overlay-primary-action-active-text-color: #1a1a1a;
      --overlay-primary-action-active-border-color: #d59a12;
      --overlay-primary-action-active-background: linear-gradient(135deg, #d59a12 0%, #FBBF24 52%, #f1c75a 100%);
      --overlay-primary-action-active-background-hover: linear-gradient(135deg, var(--brand-gold) 0%, var(--brand-gold-soft) 48%, #ffe29a 100%);
      --overlay-primary-action-active-shadow: 0 10px 24px rgba(213, 154, 18, 0.24);

      --input-dock-pill-border-color: rgba(255, 255, 255, 0.32);
      --input-dock-pill-background: rgba(255, 255, 255, 0.04);
      --input-dock-pill-text-color: rgba(255, 255, 255, 0.84);
      --input-dock-pill-hover-border-color: rgba(255, 255, 255, 0.62);
      --input-dock-pill-hover-background: rgba(255, 255, 255, 0.08);
      --input-dock-pill-hover-text-color: rgba(255, 255, 255, 0.96);
      --input-dock-pill-hover-shadow: 0 6px 14px rgba(0, 0, 0, 0.22);
      --input-dock-pill-toggle-active-background: transparent;
      --input-dock-pill-toggle-active-border-color: rgba(251, 191, 36, 0.75);
      --input-dock-pill-toggle-active-text-color: var(--brand-gold);
      --input-dock-pill-toggle-active-shadow: 0 0 0 1px rgba(251, 191, 36, 0.35);

      --input-text-color: var(--brand-gold);
      --input-placeholder-color: var(--input-text-color);

      --fullchunk-text-viewport-top-gap: 16px;
      --fullchunk-text-viewport-bottom-gap: 32px;
      --reader-text-viewport-side-gap: 12px;
      --overlay-title-font-size: 13px;
      --fullchunkdisplay-font-size: 15px;
      --pageview-text-viewport-top-gap: 20px;
      --pageview-text-viewport-bottom-gap: 16px;
      --pageviewmode-font-size: 22px;
      --pageviewmode-font-size-min: 14px;
      --pageviewmode-font-size-max: 28px;
      --fullchunkdisplay-font-size-min: 12px;
      --fullchunkdisplay-font-size-max: 18px;

      --overlay-width: 100%;
      --overlay-max-width: none;
      --overlay-top-offset: 0px;
      --overlay-shell-anchor-top: 0px;
      --overlay-shell-height: 100%;
      --overlay-spacing: 12px;
      --overlay-shell-padding-top: 16px;
      --overlay-shell-padding-inline: 12px;
      --overlay-shell-padding-bottom: 12px;
      --overlay-border-radius: 12px;
      --overlay-hero-button-font-size: 14px;
      --overlay-hero-button-min-height: 56px;
      --overlay-primary-action-width: 120px;
      --overlay-primary-action-min-height: 56px;
      --overlay-button-label-scale: 1.25;

      --overlay-glass: rgba(26, 26, 26, 0.92);
      --overlay-glass-border: rgba(107, 114, 128, 0.3);
      --overlay-radius: 12px;
      --overlay-text: #e5e7eb;
      --overlay-text-muted: #9ca3af;
      --overlay-text-faint: rgba(255, 255, 255, 0.4);

      --tier-post: var(--brand-gold);
      --tier-comments: var(--brand-gold-deep);
      --tier-replies: var(--brand-gold-soft);
      --tier-nested: rgba(255, 255, 255, 0.55);
      --tier-track-background: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      width: min(420px, 100%);
      max-width: 100%;
      margin: 0 auto;
      padding: 16px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* Under-slideshow fallback only. Not the brand page. */
      background: #1a1a1a;
      color: var(--overlay-text);
      display: flex;
      flex-direction: column;
      min-height: 100%;
      position: relative;
    }

    #slideshow {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    #slideshow .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }
    #slideshow .slide.active { opacity: 1; }
    #slideshow .slide[data-index="0"].active { transition: none; }
    #slideshow .slide-dim {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
    }

    .panel {
      position: relative;
      z-index: 2147483000;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
      min-height: 0;
    }

    .muted { color: var(--overlay-text-muted); }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .thread-url-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--overlay-text-muted);
      margin-bottom: 6px;
    }
    .thread-url-input {
      width: 100%;
      margin: 0 0 10px;
      padding: 10px 12px;
      border: 1px solid var(--input-dock-pill-border-color);
      border-radius: 10px;
      background: var(--input-dock-pill-background);
      color: var(--brand-gold);
      font: inherit;
      font-size: 13px;
    }
    .thread-url-input::placeholder { color: var(--input-placeholder-color); opacity: 0.7; }
    .thread-url-input:focus {
      outline: none;
      border-color: var(--overlay-focus-ring-color);
      box-shadow: 0 0 0 var(--overlay-focus-ring-width) rgba(251, 191, 36, 0.18);
    }
    .thread-subreddit { font-size: 12px; font-weight: 700; color: var(--overlay-text-muted); margin-bottom: 5px; }
    .thread-title { font-size: 15px; font-weight: 400; letter-spacing: -0.01em; color: var(--brand-gold); }

    .session-status {
      display: none;
    }

    .panel.is-off-reddit .input-body,
    .panel.is-off-reddit .footer-row,
    .panel.is-login-required .input-body,
    .panel.is-login-required .footer-row,
    .panel.is-need-thread .input-body,
    .panel.is-need-thread .footer-row {
      pointer-events: none;
      user-select: none;
      opacity: 0.45;
    }
    .off-reddit-gate,
    .login-required-gate,
    .need-thread-gate { display: none; flex-direction: column; gap: 10px; }
    .panel.is-off-reddit .off-reddit-gate { display: flex; }
    .panel.is-login-required .login-required-gate { display: flex; }
    .panel.is-need-thread .need-thread-gate { display: flex; }
    .panel.is-off-reddit #threadMeta,
    .panel.is-login-required #threadMeta,
    .panel.is-need-thread #threadMeta { display: none; }
    .off-reddit-gate p,
    .login-required-gate p,
    .need-thread-gate p {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--overlay-text);
      line-height: 1.35;
    }
    .off-reddit-gate a,
    .login-required-gate a,
    .need-thread-gate a {
      color: var(--brand-gold);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }
    .off-reddit-gate a:hover,
    .login-required-gate a:hover,
    .need-thread-gate a:hover { text-decoration: underline; color: var(--brand-gold-soft); }
    .thread-title.is-error { color: var(--brand-gold-deep); white-space: normal; }

    .card {
      background: var(--overlay-glass);
      border: 1px solid var(--overlay-glass-border);
      border-radius: var(--overlay-radius);
      padding: 16px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .section-divider { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--overlay-glass-border); }

    .metric-card { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .metric-value { font-size: 32px; font-weight: 700; color: var(--brand-gold); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .bar-container { display: flex; width: 100%; height: 8px; border-radius: 999px; overflow: hidden; background: var(--tier-track-background); }
    .bar-segment { height: 100%; transition: width 0.12s ease; }
    #bar-post { width: 0%; background: var(--tier-post); }
    #bar-comments { width: 0%; background: var(--tier-comments); }
    #bar-replies { width: 0%; background: var(--tier-replies); }
    #bar-reply-children { width: 0%; background: var(--tier-nested); }
    .bar-legend { display: flex; flex-wrap: wrap; row-gap: 4px; justify-content: center; gap: 14px; font-size: 11.5px; color: var(--overlay-text-muted); }
    .bar-legend-item { display: flex; align-items: center; gap: 5px; }
    .bar-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .bar-legend-dot.tier-post { background: var(--tier-post); }
    .bar-legend-dot.tier-comments { background: var(--tier-comments); }
    .bar-legend-dot.tier-replies { background: var(--tier-replies); }
    .bar-legend-dot.tier-nested { background: var(--tier-nested); }

    .primary-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      border: 1px solid var(--overlay-primary-action-active-border-color);
      border-radius: 10px;
      background: var(--overlay-primary-action-active-background);
      color: var(--overlay-primary-action-active-text-color);
      font: inherit;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      box-shadow: var(--overlay-primary-action-active-shadow);
    }
    .primary-btn:hover { background: var(--overlay-primary-action-active-background-hover); }
    .primary-btn:focus {
      outline: none;
      box-shadow: 0 0 0 var(--overlay-focus-ring-width) var(--overlay-focus-ring-color);
    }
    .primary-btn:disabled { cursor: default; opacity: 0.3; pointer-events: none; }

    .reset-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border: 1px solid var(--overlay-glass-border);
      border-radius: 10px;
      background: transparent;
      color: var(--overlay-text-muted);
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .reset-btn:hover { color: var(--overlay-text); border-color: var(--input-dock-pill-hover-border-color); }
    .reset-btn:focus {
      outline: none;
      box-shadow: 0 0 0 var(--overlay-focus-ring-width) var(--overlay-focus-ring-color);
    }

    .sort-row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; overflow-x: auto; }
    .pill-group {
      display: flex;
      flex: none;
      border: 1px solid var(--input-dock-pill-border-color);
      border-radius: 999px;
      overflow: hidden;
      background: var(--input-dock-pill-background);
    }
    .pill-group input[type="radio"] { display: none; }
    .pill-group label {
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      color: var(--input-dock-pill-text-color);
      border-right: 1px solid rgba(255, 255, 255, 0.14);
      user-select: none;
      white-space: nowrap;
    }
    .pill-group label:last-child { border-right: none; }
    .pill-group input[type="radio"]:checked + label {
      background: var(--overlay-title-filled-inactive-background);
      color: var(--reader-selection-text-color);
      box-shadow: inset 0 0 0 1px var(--reader-selection-border-color);
    }
    .post-only-pill {
      display: flex; flex: none; align-items: center; gap: 6px;
      padding: 8px 12px;
      border: 1px solid var(--input-dock-pill-border-color);
      border-radius: 999px;
      font-size: 12.5px; font-weight: 500;
      color: var(--input-dock-pill-text-color);
      background: var(--input-dock-pill-background);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .post-only-pill:has(input:checked) {
      color: var(--reader-selection-text-color);
      box-shadow: 0 0 0 1px var(--reader-selection-border-color);
    }
    .post-only-pill input[type="checkbox"] { accent-color: var(--brand-gold); }

    .stair-sliders { display: flex; flex-direction: column; gap: 8px; }
    .stair-row { display: flex; align-items: center; gap: 4px; padding: 4px 0; cursor: pointer; }
    .stair-row input { cursor: auto; }
    .stair-connector { color: var(--overlay-text-faint); font-size: 15px; flex: none; line-height: 1; }
    .stair-label-col { flex: none; }

    input[type="range"].h-slider {
      flex: 1;
      margin-left: 8px;
      height: 14px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--tier-track-background);
      border-radius: 999px;
      outline: none;
      min-width: 60px;
    }
    input[type="range"].h-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--brand-gold);
      cursor: pointer;
    }
    input[type="range"].h-slider::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--brand-gold); border: none; cursor: pointer;
    }

    input.eq-value-input {
      width: 24px;
      padding: 3px 2px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--overlay-text);
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }
    input.eq-value-input::-webkit-inner-spin-button,
    input.eq-value-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input.eq-value-input:focus {
      outline: none;
      border-color: var(--overlay-focus-ring-color);
      box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.12);
      background: var(--overlay-title-shell-base);
    }
    #commentLimitLabel.eq-value-input { border-bottom-width: 2px; border-bottom-color: color-mix(in srgb, var(--tier-comments) 15%, transparent); }
    #maxRepliesLabel.eq-value-input { border-bottom-width: 2px; border-bottom-color: color-mix(in srgb, var(--tier-replies) 15%, transparent); }
    #maxReplyChildrenLabel.eq-value-input { border-bottom-width: 2px; border-bottom-color: color-mix(in srgb, var(--tier-nested) 15%, transparent); }

    .eq-label {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: var(--overlay-text-muted);
      border-bottom: 2px solid transparent;
    }
    #commentLimitEqLabel { border-bottom-color: color-mix(in srgb, var(--tier-comments) 15%, transparent); }
    #maxRepliesEqLabel { border-bottom-color: color-mix(in srgb, var(--tier-replies) 15%, transparent); }
    #maxReplyChildrenEqLabel { border-bottom-color: color-mix(in srgb, var(--tier-nested) 15%, transparent); }

    .tree-dot { stroke: none; }
    .tree-dot.depth-post { fill: var(--tier-post); }
    .tree-dot.depth-comment { fill: var(--tier-comments); }
    .tree-dot.depth-reply { fill: var(--tier-replies); }
    .tree-dot.depth-child { fill: var(--tier-nested); }
    .tree-dot.depth-muted { fill: var(--tier-nested); }
    .tree-bar { opacity: 0.15; }
    .tree-bar.depth-post { fill: var(--tier-post); }
    .tree-bar.depth-comment { fill: var(--tier-comments); }
    .tree-bar.depth-reply { fill: var(--tier-replies); }
    .tree-bar.depth-child { fill: var(--tier-nested); }
    .tree-bar.depth-muted { fill: var(--tier-nested); }
    .tree-overflow-chip { fill: var(--overlay-title-shell-base); stroke: var(--overlay-glass-border); stroke-width: 1; }
    .tree-overflow-label { fill: var(--overlay-text-muted); font-size: 9.5px; }

    #commentLimit.h-slider::-webkit-slider-thumb { background: var(--tier-comments); }
    #commentLimit.h-slider::-moz-range-thumb { background: var(--tier-comments); }
    #maxReplies.h-slider::-webkit-slider-thumb { background: var(--tier-replies); }
    #maxReplies.h-slider::-moz-range-thumb { background: var(--tier-replies); }
    #maxReplyChildren.h-slider::-webkit-slider-thumb { background: var(--tier-nested); }
    #maxReplyChildren.h-slider::-moz-range-thumb { background: var(--tier-nested); }

    .footer-row { display: flex; align-items: center; gap: 10px; padding: 2px; font-size: 12px; }
    .footer-row .muted { display: flex; align-items: center; gap: 6px; }

    .input-overlay {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .input-overlay[hidden],
    .footer-row[hidden],
    .panel.is-returns-open .input-overlay,
    .panel.is-returns-open .footer-row {
      display: none !important;
    }
    .input-top {
      flex: 0 0 auto;
    }
    .input-body,
    #screen-input {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .input-stack {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }
    .input-hero-dock {
      flex: 0 0 auto;
      margin-top: auto;
    }
    #returns-overlay-host {
      display: none;
      flex: 1;
      min-height: 0;
      position: relative;
    }
    #returns-overlay-host.is-open { display: block; }
    #returns-overlay-host .builtin-overlay,
    #returns-overlay-host .builtin-overlay[data-active-view="loading"],
    #returns-overlay-host .builtin-overlay[data-active-view="fullchunk"],
    #returns-overlay-host .builtin-overlay[data-active-view="pageview"] {
      top: 0;
      height: 100%;
      min-height: 0;
      max-height: 100%;
      width: 100%;
    }

    /* Narrow side panel: subreddit on line 1, full title on line 2, both left-aligned. */
    #returns-overlay-host .overlay-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      column-gap: 8px;
      row-gap: 4px;
    }
    #returns-overlay-host .header-left {
      grid-column: 1;
      grid-row: 1;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 0;
      min-width: 0;
    }
    #returns-overlay-host .header-center {
      display: none !important;
    }
    #returns-overlay-host .header-right {
      grid-column: 2;
      grid-row: 1;
      align-items: flex-start;
    }
    #returns-overlay-host .overlay-title-static {
      overflow: visible;
      text-overflow: unset;
      white-space: normal;
      text-align: left;
      width: 100%;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--overlay-text-muted);
      margin-bottom: 5px;
    }
    #returns-overlay-host #loadBtn {
      display: none !important;
    }
    #returns-overlay-host .rmr-overlay-title {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      color: var(--brand-gold);
      font-size: var(--overlay-title-font-size, 13px);
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: -0.01em;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    #returns-overlay-host .rmr-overlay-title[hidden] {
      display: none;
    }
    #returns-overlay-host .header-title-readout {
      display: none !important;
    }

    /* Playback: vertically center the page in the remaining viewport. */
    #returns-overlay-host .builtin-overlay[data-active-view="pageview"] .overlay-content,
    #returns-overlay-host .builtin-overlay[data-active-view="pageview"] .overlay-body,
    #returns-overlay-host .builtin-overlay[data-active-view="pageview"] .overlay-main,
    #returns-overlay-host .builtin-overlay[data-active-view="pageview"] #pageView {
      height: 100%;
      min-height: 0;
    }
    #returns-overlay-host #pageViewDisplay {
      justify-content: center;
    }
    #returns-overlay-host #pageViewDisplay .text-content {
      justify-content: center;
    }

    /* No name-your-art field. Post title is committed in the header. */
    #returns-overlay-host #loadingTitleRow,
    #returns-overlay-host #titleRowHint,
    #returns-overlay-host .loading-autoplay-toggle,
    #returns-overlay-host .builtin-overlay[data-active-view="loading"] .overlay-progress-row {
      display: none !important;
    }

    /* Loading: countdown sits in the leftover viewport, vertically centered. */
    #returns-overlay-host .builtin-overlay[data-active-view="loading"] {
      grid-template-rows: auto minmax(0, 1fr);
    }
    #returns-overlay-host .builtin-overlay[data-active-view="loading"] .overlay-content {
      grid-row: 2;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #returns-overlay-host .builtin-overlay[data-active-view="loading"] .overlay-body,
    #returns-overlay-host .builtin-overlay[data-active-view="loading"] .overlay-main,
    #returns-overlay-host .builtin-overlay[data-active-view="loading"] .view-panel,
    #returns-overlay-host .builtin-overlay[data-active-view="loading"] #loadingInterface {
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #consoleErrorNotice {
      color: var(--brand-gold-deep);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="slideshow" aria-hidden="true">
    <div class="slide active" data-index="0" style="background-image: url('https://images.unsplash.com/photo-1557683316-973673baf926?w=1920&h=1080&fit=crop');"></div>
  </div>

  <div class="panel" id="panel">
    <div class="card input-overlay" id="input-overlay">
      <div class="input-top thread-context">
        <label class="thread-url-label" for="threadUrlInput">Reddit thread</label>
        <input type="url" class="thread-url-input" id="threadUrlInput" placeholder="Paste a reddit.com or redd.it link" autocomplete="off" spellcheck="false">
        <div id="threadMeta">
          <div class="thread-subreddit" id="subredditLabel">r/...</div>
          <div class="thread-title truncate" id="postTitle">Paste a thread to begin</div>
        </div>
        <div class="need-thread-gate" id="needThreadGate" aria-live="polite">
          <p>Paste a Reddit thread URL to use Read Me Reddit.</p>
        </div>
      </div>

      <div class="input-body section-divider" id="screen-input">
        <div class="input-stack">
          <div class="stair-sliders gated-by-post-only">
            <div class="stair-row" style="margin-left: 0;">
              <div class="stair-label-col">
                <div class="eq-label" id="commentLimitEqLabel">Comments</div>
              </div>
              <input type="range" class="h-slider" id="commentLimit" min="0" max="50" step="1" value="10">
              <input type="number" class="eq-value-input" id="commentLimitLabel" min="0" max="50" step="1" value="10">
            </div>
            <div class="stair-row" style="margin-left: 22px;">
              <span class="stair-connector">&#8618;</span>
              <div class="stair-label-col">
                <div class="eq-label" id="maxRepliesEqLabel">Replies</div>
              </div>
              <input type="range" class="h-slider" id="maxReplies" min="0" max="10" step="1" value="1">
              <input type="number" class="eq-value-input" id="maxRepliesLabel" min="0" max="10" step="1" value="1">
            </div>
            <div class="stair-row" style="margin-left: 44px;">
              <span class="stair-connector">&#8618;</span>
              <div class="stair-label-col">
                <div class="eq-label" id="maxReplyChildrenEqLabel">Replies</div>
              </div>
              <input type="range" class="h-slider" id="maxReplyChildren" min="0" max="10" step="1" value="1">
              <input type="number" class="eq-value-input" id="maxReplyChildrenLabel" min="0" max="10" step="1" value="1">
            </div>
          </div>

          <div class="sort-row section-divider">
            <div class="pill-group" role="radiogroup" aria-label="Sort by">
              <input type="radio" name="sort" id="sortBest" value="best" checked><label for="sortBest">Best</label>
              <input type="radio" name="sort" id="sortTop" value="top"><label for="sortTop">Top</label>
              <input type="radio" name="sort" id="sortNew" value="new"><label for="sortNew">Newest</label>
              <input type="radio" name="sort" id="sortOld" value="old"><label for="sortOld">Oldest</label>
            </div>
            <label class="post-only-pill">
              <input type="checkbox" id="postOnlyToggle">
              <span>Post Only</span>
            </label>
          </div>

          <svg id="replyTreeSvg" class="section-divider" width="100%" height="210" viewBox="0 0 320 210" aria-hidden="true"></svg>
        </div>

        <div class="input-hero-dock">
          <div class="metric-card section-divider">
            <div class="metric-value" id="estTime">0:00</div>
            <div class="bar-container">
              <div id="bar-post" class="bar-segment"></div>
              <div id="bar-comments" class="bar-segment"></div>
              <div id="bar-replies" class="bar-segment"></div>
              <div id="bar-reply-children" class="bar-segment"></div>
            </div>
            <div class="bar-legend">
              <div class="bar-legend-item"><span class="bar-legend-dot tier-post"></span>Post</div>
              <div class="bar-legend-item"><span class="bar-legend-dot tier-comments"></span>Comments</div>
              <div class="bar-legend-item"><span class="bar-legend-dot tier-replies"></span>Replies</div>
              <div class="bar-legend-item"><span class="bar-legend-dot tier-nested"></span>Nested</div>
            </div>
          </div>

          <button id="generateAudioBtn" class="primary-btn section-divider">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M1 8h1.5l1-3 2 6 2-9 2 9 1-3H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Read Me Reddit
          </button>
        </div>
      </div>
    </div>

    <div id="returns-overlay-host"></div>

    <div class="footer-row">
      <span class="muted">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="9" r="1" fill="currentColor"/><circle cx="13" cy="9" r="1" fill="currentColor"/></svg>
        Reddit thread
      </span>
      <button type="button" id="rmrInputResetBtn" class="reset-btn" title="Clear results and read a new page">
        <svg width="12" height="12" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16 4v5h-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 10a6 6 0 0 1 10.5-4M4 10a6 6 0 0 0 10.5 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Reset
      </button>
    </div>
  </div>
  <script type="module" src="./engine/playback-module/highlighting/config.js"></script>
  <script type="module" src="./engine/playback-module/highlighting/page-turn-timing.js"></script>
  <script type="module" src="./engine/playback-module/highlighting/color-cycler.js"></script>
  <script type="module" src="./engine/playback-module/highlighting/click-to-seek-manager.js"></script>
  <script type="module" src="./engine/playback-module/highlighting/page-line-balancer.js"></script>
  <script type="module" src="./engine/playback-module/highlighting/pause-state.js"></script>
  <script type="module" src="./engine/playback-module/highlighting/word-dom-renderer.js"></script>
  <script type="module" src="./engine/playback-module/highlighting/engine.js"></script>
  <script type="module" src="./engine/playback/reader-playback-adapter.js"></script>
  <script src="./engine/transport/shared-backend-transport.js"></script>
  <script src="./engine/playback/audio-input-data-core.js"></script>
  <script src="./engine/playback/audio-input-display.js"></script>
  <script src="./engine/playback/audio-progress.js"></script>
  <script src="./engine/playback/audio-navigation.js"></script>
  <script src="./engine/playback/page-times.js"></script>
  <script src="./engine/playback/readable-text-size.js"></script>
  <script src="./engine/playback/audio-controls.js"></script>
  <script src="./engine/playback/audio-playback.js"></script>
  <script src="./engine/playback/chunk-load-coordinator.js"></script>
  <script src="./engine/playback/local-audio-artifact-store.js"></script>
  <script src="./engine/loading/loading-segment-line-emergence.js"></script>
  <script src="./engine/loading/loading-first-sentence-grabber.js"></script>
  <script src="./engine/overlay/markup.js"></script>
  <script src="./engine/overlay/returns-actions.js"></script>
  <script src="./engine/overlay/shell-runtime.js"></script>
  <script src="./host-cloudrun.js"></script>
  <script src="./host-returns.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
